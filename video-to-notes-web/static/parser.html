<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频解析器 — Video to Notes</title>
<style>
  :root {
    --bg: #faf8f5;
    --surface: #ffffff;
    --border: #e8e4dd;
    --text: #7a7165;
    --text-dim: #b0a89a;
    --heading: #5c5040;
    --accent: #9b8870;
    --accent-hover: #7a6a55;
    --green: #5b8c5a;
    --red: #c4665a;
    --radius: 10px;
    --radius-lg: 14px;
    --font: "Inter", "PingFang SC", "SF Pro Display", system-ui, -apple-system, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 720px; width: 100%; margin: 0 auto; padding: 80px 24px 120px;
  }

  /* Header */
  header { margin-bottom: 48px; text-align: center; }
  header h1 { font-size: 1.6rem; font-weight: 600; color: var(--heading); letter-spacing: -0.02em; }
  header p { font-size: 0.9rem; color: var(--text-dim); margin-top: 6px; }

  /* URL Input */
  .input-card { margin-bottom: 32px; }
  .input-row { display: flex; gap: 8px; }
  .input-row input {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 18px; color: var(--heading);
    font-size: 0.95rem; font-family: var(--font); outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139,115,85,0.08); }
  .input-row input::placeholder { color: var(--text-dim); }

  .btn {
    background: var(--accent); color: #fff; border: none; border-radius: var(--radius);
    padding: 14px 28px; font-size: 0.95rem; font-family: var(--font); cursor: pointer;
    transition: background 0.2s, transform 0.1s; font-weight: 500; letter-spacing: -0.01em;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-sm {
    padding: 10px 18px; font-size: 0.85rem; border-radius: 8px; font-weight: 500;
    background: var(--surface); border: 1px solid var(--border); color: var(--heading); cursor: pointer;
    transition: all 0.15s;
  }
  .btn-sm:hover { border-color: var(--accent); color: var(--accent); }

  .btn-sm.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-sm.primary:hover { background: var(--accent-hover); }

  /* Platform tag */
  .platform-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 20px; font-size: 0.82rem; font-weight: 500;
    margin-top: 10px;
  }
  .platform-badge.detected { background: #e8f5e9; color: #2e7d32; }

  /* Loading */
  .loading-area {
    text-align: center; padding: 40px 0; display: none;
  }
  .spinner {
    width: 36px; height: 36px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Result card */
  .result-card {
    display: none; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 32px;
  }
  .result-card .cover {
    width: 100%; max-height: 400px; object-fit: cover; display: block;
    background: #f0ede8;
  }
  .result-card .cover-placeholder {
    width: 100%; height: 200px; display: flex; align-items: center; justify-content: center;
    background: #f0ede8; color: var(--text-dim); font-size: 0.9rem;
  }
  .result-card .info { padding: 24px; }
  .result-card .info h2 { font-size: 1.2rem; color: var(--heading); line-height: 1.5; margin-bottom: 12px; font-weight: 600; }
  .result-card .meta-row {
    display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 0.88rem; color: var(--text);
    margin-bottom: 20px;
  }
  .result-card .meta-row span { display: inline-flex; align-items: center; gap: 4px; }

  .result-card .actions { display: flex; gap: 10px; flex-wrap: wrap; padding: 0 24px 24px; }

  /* History */
  .history-card { margin-bottom: 32px; }
  .history-card h3 { font-size: 0.95rem; color: var(--heading); margin-bottom: 12px; font-weight: 600; }
  .history-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 8px; font-size: 0.88rem;
    cursor: pointer; transition: border-color 0.15s;
  }
  .history-item:hover { border-color: var(--accent); }
  .history-item .hi-title { color: var(--heading); font-weight: 500; flex: 1; }
  .history-item .hi-meta { color: var(--text-dim); font-size: 0.78rem; margin: 0 12px; white-space: nowrap; }
  .history-item .hi-platform {
    font-size: 0.72rem; padding: 2px 8px; border-radius: 10px;
    background: #f0ede8; color: var(--text-dim); margin-right: 10px;
  }
  .history-empty { color: var(--text-dim); font-size: 0.85rem; padding: 16px 0; text-align: center; }

  /* Toast */
  .toast {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    background: var(--heading); color: #fff; padding: 10px 24px; border-radius: 8px;
    font-size: 0.85rem; z-index: 999; opacity: 0; transition: opacity 0.3s;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 600px) {
    .container { padding: 48px 16px 80px; }
    .result-card .actions { flex-direction: column; }
    .result-card .actions .btn-sm { text-align: center; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>🔍 视频解析器</h1>
    <p>粘贴链接，自动识别平台，提取视频信息和转录文本</p>
  </header>

  <!-- URL Input -->
  <div class="input-card">
    <div class="input-row">
      <input type="text" id="urlInput" placeholder="粘贴视频链接…"
             autocomplete="off" autofocus>
      <button class="btn" id="parseBtn" onclick="startParse()">解析</button>
    </div>
    <div id="platformBadge"></div>
  </div>

  <!-- Loading -->
  <div class="loading-area" id="loadingArea">
    <div class="spinner"></div>
    <p style="color:var(--text-dim);font-size:0.88rem" id="loadingText">解析中…</p>
  </div>

  <!-- Result -->
  <div class="result-card" id="resultCard">
    <img class="cover" id="coverImg" alt="封面" style="display:none">
    <div class="cover-placeholder" id="coverPlaceholder">🎬 无封面</div>
    <div class="info">
      <h2 id="infoTitle"></h2>
      <div class="meta-row">
        <span id="infoCreator"></span>
        <span id="infoPlatform"></span>
        <span id="infoLikes"></span>
        <span id="infoDuration"></span>
      </div>
    </div>
    <div class="actions">
      <button class="btn-sm primary" onclick="downloadAudio()">🎵 下载音频</button>
      <button class="btn-sm" onclick="downloadVideo()">🎬 下载视频</button>
      <button class="btn-sm" onclick="downloadTranscript()">📝 下载转录文本</button>
    </div>
  </div>

  <!-- History -->
  <div class="history-card">
    <h3>📋 解析历史</h3>
    <div id="historyList"><div class="history-empty">暂无解析记录</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── State ───
let currentTaskId = null;
let currentMeta = {};
let currentTranscript = '';
let isParsing = false;

const TRANSCRIPTS_KEY = 'vtn-transcripts';
const MAX_HISTORY = 30;

// ─── Toast ───
function showToast(msg, ms = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}

// ─── History ───
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(TRANSCRIPTS_KEY) || '[]'); }
  catch { return []; }
}
function saveHistory(entry) {
  const h = [entry, ...loadHistory()].slice(0, MAX_HISTORY);
  localStorage.setItem(TRANSCRIPTS_KEY, JSON.stringify(h));
  renderHistory();
}
function renderHistory() {
  const h = loadHistory();
  const el = document.getElementById('historyList');
  if (!h.length) { el.innerHTML = '<div class="history-empty">暂无解析记录</div>'; return; }
  el.innerHTML = h.map((e, i) => `
    <div class="history-item" onclick="viewHistory(${i})">
      <span class="hi-platform">${e.platform || ''}</span>
      <span class="hi-title">${escHtml(e.title || '无标题')}</span>
      <span class="hi-meta">${e.date || ''}</span>
    </div>
  `).join('');
}
function viewHistory(i) {
  const h = loadHistory();
  const e = h[i];
  if (!e) return;
  currentTaskId = e.taskId;
  currentMeta = { title: e.title, creator: e.creator, platform: e.platform,
                  likes: e.likes, duration: e.duration, thumbnail: e.thumbnail,
                  webpage_url: e.webpageUrl };
  currentTranscript = e.transcript;
  showResult(currentMeta);
  document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth' });
}
function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || ''; return d.innerHTML;
}

// ─── Format helpers ───
function fmtDuration(sec) {
  if (!sec) return '';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m >= 60 ? `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}:${String(s).padStart(2,'0')}`
                 : `${m}:${String(s).padStart(2,'0')}`;
}
function fmtLikes(n) {
  const v = parseInt(n) || 0;
  if (v >= 10000) return (v / 10000).toFixed(1) + '万';
  if (v >= 1000) return (v / 1000).toFixed(1) + 'k';
  return String(v);
}
const PLATFORM_NAMES = {
  xhs: '小红书', bilibili: 'B站', youtube: 'YouTube',
  douyin: '抖音', kuaishou: '快手', youku: '优酷',
  mgtv: '芒果TV', qqvideo: '腾讯视频', iqiyi: '爱奇艺',
  unknown: '未知平台'
};
function fmtPlatform(id) { return PLATFORM_NAMES[id] || id; }

// ─── Parse ───
async function startParse() {
  const input = document.getElementById('urlInput').value.trim();
  if (!input) return;
  if (isParsing) return;

  // Reset
  isParsing = true;
  document.getElementById('parseBtn').disabled = true;
  document.getElementById('resultCard').style.display = 'none';
  document.getElementById('platformBadge').innerHTML = '';
  document.getElementById('loadingArea').style.display = 'block';
  document.getElementById('loadingText').textContent = '解析中…';

  try {
    const resp = await fetch('/api/process', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: input, stop_at: 'transcribe' })
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      const lines = buf.split('\n');
      buf = lines.pop(); // 保留未完成行

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const evt = JSON.parse(line.slice(6));
          if (evt.event === 'progress') {
            updateLoadingText(evt.data);
          } else if (evt.event === 'complete') {
            handleComplete(evt.data);
            return;
          } else if (evt.event === 'error') {
            showToast('❌ ' + evt.data);
            resetUI();
            return;
          }
        } catch {}
      }
    }
  } catch (e) {
    showToast('❌ 网络错误: ' + e.message);
    resetUI();
  }
}

function updateLoadingText(data) {
  const step = data.step;
  const msg = data.message || '';
  const el = document.getElementById('loadingText');
  if (step === 'resolve') el.textContent = '🔗 解析链接…';
  else if (step === 'download') el.textContent = '📥 下载中…';
  else if (step === 'transcribe') el.textContent = '🎙️ 语音转录…';
}

function handleComplete(data) {
  currentTaskId = data.task_id;
  currentMeta = data.meta;
  currentTranscript = data.transcript || '';

  // Show platform badge
  const pname = fmtPlatform(currentMeta.platform);
  document.getElementById('platformBadge').innerHTML =
    `<span class="platform-badge detected">✅ 识别为 ${pname}</span>`;

  // Show result card
  showResult(currentMeta);

  // Save to history
  saveHistory({
    taskId: currentTaskId,
    title: currentMeta.title,
    creator: currentMeta.creator,
    platform: currentMeta.platform,
    likes: currentMeta.likes,
    duration: currentMeta.duration,
    thumbnail: currentMeta.thumbnail,
    webpageUrl: currentMeta.webpage_url,
    transcript: currentTranscript,
    date: new Date().toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
  });

  resetUI();
}

function showResult(meta) {
  // Cover
  const coverImg = document.getElementById('coverImg');
  const coverPlaceholder = document.getElementById('coverPlaceholder');
  if (meta.thumbnail) {
    coverImg.src = meta.thumbnail;
    coverImg.style.display = 'block';
    coverPlaceholder.style.display = 'none';
  } else {
    coverImg.style.display = 'none';
    coverPlaceholder.style.display = 'flex';
  }

  document.getElementById('infoTitle').textContent = meta.title || '无标题';
  document.getElementById('infoCreator').textContent = '👤 ' + (meta.creator || '未知');
  document.getElementById('infoPlatform').textContent = '📺 ' + fmtPlatform(meta.platform);
  document.getElementById('infoLikes').textContent = '❤️ ' + fmtLikes(meta.likes);
  document.getElementById('infoDuration').textContent = meta.duration ? '⏱ ' + fmtDuration(meta.duration) : '';

  document.getElementById('resultCard').style.display = 'block';
}

function resetUI() {
  isParsing = false;
  document.getElementById('parseBtn').disabled = false;
  document.getElementById('loadingArea').style.display = 'none';
}

// ─── Downloads ───
function downloadAudio() {
  if (!currentTaskId) return;
  showToast('⬇️ 开始下载音频…');
  window.open(`/api/download/${currentTaskId}/audio`, '_blank');
}
function downloadVideo() {
  if (!currentTaskId) return;
  showToast('⬇️ 开始下载视频（较大，请耐心等待）…', 4000);
  window.open(`/api/download/${currentTaskId}/video`, '_blank');
}
function downloadTranscript() {
  if (!currentTaskId) return;
  showToast('⬇️ 开始下载转录文本…');
  window.open(`/api/download/${currentTaskId}/transcript`, '_blank');
}

// ─── Enter key ───
document.getElementById('urlInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') startParse();
});

// ─── Init ───
renderHistory();
</script>
</body>
</html>
