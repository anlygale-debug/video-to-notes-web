<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — Video to Notes</title>
<style>
  :root {
    --bg: #faf8f5;
    --surface: #ffffff;
    --border: #e8e4dd;
    --text: #7a7165;
    --text-dim: #b0a89a;
    --heading: #5c5040;
    --accent: #9b8870;
    --accent-hover: #7a6a55;
    --green: #5b8c5a;
    --red: #c4665a;
    --radius-sm: 6px;
    --radius: 10px;
    --font: "Inter", "PingFang SC", "SF Pro Display", system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", "SF Mono", "Fira Code", monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .container { max-width: 520px; margin: 0 auto; padding: 80px 24px 80px; }

  /* Header */
  header { margin-bottom: 48px; }
  header h1 { font-size: 1.6rem; font-weight: 600; color: var(--heading); letter-spacing: -0.03em; margin-bottom: 6px; }
  header p { font-size: 0.9rem; color: var(--text-dim); letter-spacing: -0.01em; }

  /* Form */
  .form-group { margin-bottom: 20px; }
  .form-group label {
    display: block;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--heading);
    margin-bottom: 6px;
    letter-spacing: -0.01em;
  }
  .form-group input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    color: var(--heading);
    font-size: 0.9rem;
    font-family: var(--font);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    letter-spacing: -0.01em;
  }
  .form-group input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(139,115,85,0.08);
  }
  .form-group input::placeholder { color: var(--text-dim); }
  .form-group .hint { font-size: 0.78rem; color: var(--text-dim); margin-top: 4px; }

  /* Buttons */
  .btn-row { display: flex; gap: 8px; margin-top: 28px; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 20px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 0.9rem;
    font-family: var(--font);
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: -0.01em;
    background: var(--surface);
    color: var(--text);
  }
  .btn:hover { border-color: var(--border); color: var(--heading); background: #faf8f5; }
  .btn-primary {
    background: var(--heading);
    color: #fff;
    border-color: var(--heading);
    font-weight: 600;
  }
  .btn-primary:hover { background: #4a3d30; color: #fff; border-color: #4a3d30; }
  .btn-test {
    background: var(--surface);
    color: var(--accent);
    border-color: var(--accent);
  }
  .btn-test:hover { background: #f7f3ec; color: var(--accent-hover); }
  .btn-test:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 20px;
    border-radius: 99px;
    font-size: 0.85rem;
    font-weight: 500;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show { opacity: 1; }
  .toast.success { background: var(--green); color: #fff; }
  .toast.error { background: var(--red); color: #fff; }

  /* Back link */
  .back-link { margin-top: 36px; text-align: center; }
  .back-link a {
    color: var(--text-dim);
    font-size: 0.85rem;
    text-decoration: none;
    letter-spacing: -0.01em;
    transition: color 0.15s;
  }
  .back-link a:hover { color: var(--heading); }

  @media (max-width: 600px) {
    .container { padding: 32px 14px 60px; }
    header h1 { font-size: 1.3rem; }
    .btn-row { flex-direction: column; }
    .btn { width: 100%; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>API 设置</h1>
    <p>配置 LLM 接口连接信息</p>
  </header>

  <div class="form-group">
    <label for="apiBaseUrl">API Base URL</label>
    <input type="text" id="apiBaseUrl" placeholder="https://api.deepseek.com/anthropic" autocomplete="off">
    <div class="hint">接口地址，例如 https://api.deepseek.com/anthropic</div>
  </div>

  <div class="form-group">
    <label for="apiKey">API Key</label>
    <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">
    <div class="hint">API 密钥，仅保存在本地 config.json</div>
  </div>

  <div class="form-group">
    <label for="model">Model</label>
    <input type="text" id="model" placeholder="DeepSeek-V4-pro[1m]" autocomplete="off">
    <div class="hint">模型名称，如 DeepSeek-V4-pro[1m] 或 claude-sonnet-4-6</div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" onclick="saveSettings()">保存设置</button>
    <button class="btn btn-test" id="testBtn" onclick="testConnection()">测试连接</button>
  </div>

  <div class="back-link">
    <a href="/">← 返回主页</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Load existing settings ───────────────────────────────────
async function loadSettings() {
  try {
    const resp = await fetch('/api/settings');
    const cfg = await resp.json();
    document.getElementById('apiBaseUrl').value = cfg.api_base_url || '';
    document.getElementById('apiKey').value = cfg.api_key || '';
    document.getElementById('model').value = cfg.model || '';
  } catch (e) {}
}

// ── Save ─────────────────────────────────────────────────────
async function saveSettings() {
  const api_base_url = document.getElementById('apiBaseUrl').value.trim();
  const api_key = document.getElementById('apiKey').value.trim();
  const model = document.getElementById('model').value.trim();

  if (!api_base_url || !api_key) {
    showToast('请填写 API Base URL 和 API Key', 'error');
    return;
  }

  try {
    const resp = await fetch('/api/settings', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({api_base_url, api_key, model})
    });
    if (resp.ok) {
      showToast('设置已保存', 'success');
      setTimeout(() => { window.location.href = '/'; }, 800);
    }
  } catch (e) {
    showToast('保存失败: ' + e.message, 'error');
  }
}

// ── Test connection ──────────────────────────────────────────
async function testConnection() {
  const api_base_url = document.getElementById('apiBaseUrl').value.trim();
  const api_key = document.getElementById('apiKey').value.trim();
  const model = document.getElementById('model').value.trim();

  if (!api_base_url || !api_key) {
    showToast('请先填写 API Base URL 和 API Key', 'error');
    return;
  }

  const btn = document.getElementById('testBtn');
  btn.disabled = true;
  btn.textContent = '测试中…';

  try {
    const resp = await fetch(api_base_url + '/messages', {
      method: 'POST',
      headers: {
        'x-api-key': api_key,
        'anthropic-version': '2023-06-01',
        'content-type': 'application/json',
      },
      body: JSON.stringify({
        model: model || 'claude-sonnet-4-6',
        max_tokens: 1,
        messages: [{role: 'user', content: 'hi'}]
      })
    });

    if (resp.ok) {
      showToast('连接成功', 'success');
    } else {
      const text = await resp.text();
      showToast('连接失败: ' + (text || resp.status).substring(0, 80), 'error');
    }
  } catch (e) {
    showToast('连接失败: ' + e.message.substring(0, 80), 'error');
  }

  btn.disabled = false;
  btn.textContent = '测试连接';
}

// ── Toast ────────────────────────────────────────────────────
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  setTimeout(() => t.classList.remove('show'), 2500);
}

loadSettings();
</script>
</body>
</html>
