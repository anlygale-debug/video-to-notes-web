<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video to Notes</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
  :root {
    --bg: #faf8f5;
    --surface: #ffffff;
    --border: #e8e4dd;
    --text: #7a7165;
    --text-dim: #b0a89a;
    --heading: #5c5040;
    --accent: #9b8870;
    --accent-hover: #7a6a55;
    --green: #5b8c5a;
    --red: #c4665a;
    --amber: #c49b4a;
    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 14px;
    --font: "Inter", "PingFang SC", "SF Pro Display", system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", "SF Mono", "Fira Code", monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .container {
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    padding: 80px 24px 120px;
  }

  /* Header — — — — — — — — — — — — — — — — — — — — — — */
  header {
    margin-bottom: 64px;
    text-align: left;
  }
  header h1 {
    font-size: 2rem;
    font-weight: 600;
    color: var(--heading);
    letter-spacing: -0.03em;
    margin-bottom: 8px;
  }
  header p {
    font-size: 0.95rem;
    color: var(--text-dim);
    letter-spacing: -0.01em;
  }

  /* Input — — — — — — — — — — — — — — — — — — — — — — — */
  .input-card {
    margin-bottom: 40px;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .input-row input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    color: var(--heading);
    font-size: 0.95rem;
    font-family: var(--font);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    letter-spacing: -0.01em;
  }
  .input-row input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(139,115,85,0.08);
  }
  .input-row input::placeholder { color: var(--text-dim); }
  .input-row select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    color: var(--heading);
    font-size: 0.9rem;
    font-family: var(--font);
    cursor: pointer;
    outline: none;
    min-width: 116px;
    -webkit-appearance: none;
    appearance: none;
    background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%236b6b6b' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 36px;
  }
  .input-row select:focus { border-color: var(--accent); }

  /* Input tabs — — — — — — — — — — — — — — — — — — — — — — */
  .input-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .input-tab {
    padding: 10px 20px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-dim);
    font-size: 0.88rem;
    font-family: var(--font);
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
    letter-spacing: -0.01em;
  }
  .input-tab:hover { color: var(--heading); }
  .input-tab.active {
    color: var(--heading);
    border-bottom-color: var(--accent);
    font-weight: 500;
  }

  /* Textarea — — — — — — — — — — — — — — — — — — — — — — — — */
  .input-textarea {
    width: 100%;
    min-height: 120px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    color: var(--heading);
    font-size: 0.9rem;
    font-family: var(--font);
    outline: none;
    resize: vertical;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(139,115,85,0.08);
  }
  .input-textarea::placeholder { color: var(--text-dim); }

  /* Title input — — — — — — — — — — — — — — — — — — — — — — — */
  .title-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 16px;
    color: var(--heading);
    font-size: 0.95rem;
    font-family: var(--font);
    font-weight: 500;
    outline: none;
    margin-bottom: 10px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .title-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(139,115,85,0.08);
  }
  .title-input::placeholder { color: var(--text-dim); font-weight: 400; }

  /* Mode buttons — — — — — — — — — — — — — — — — — — — — — — */
  .mode-btn-group {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
  }
  .mode-btn {
    flex: 1;
    padding: 8px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-dim);
    font-size: 0.82rem;
    font-family: var(--font);
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    letter-spacing: -0.01em;
  }
  .mode-btn:hover { border-color: var(--accent); color: var(--heading); }
  .mode-btn.active {
    background: var(--heading);
    color: #fff;
    border-color: var(--heading);
    font-weight: 500;
  }

  /* Buttons — — — — — — — — — — — — — — — — — — — — — — */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 20px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 0.9rem;
    font-family: var(--font);
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: -0.01em;
    background: var(--surface);
    color: var(--text);
  }
  .btn:hover { border-color: var(--border); color: var(--heading); background: #faf8f5; }
  .btn-primary {
    background: var(--heading);
    color: #fff;
    border-color: var(--heading);
    font-weight: 600;
  }
  .btn-primary:hover { background: #4a3d30; color: #fff; border-color: #4a3d30; }
  .btn-primary:disabled { background: var(--border); color: var(--text-dim); border-color: var(--border); cursor: not-allowed; }
  .btn-full { width: 100%; }
  .btn-sm { padding: 6px 14px; font-size: 0.82rem; border-radius: var(--radius-sm); }
  .btn-row { display: flex; gap: 8px; margin-top: 24px; flex-wrap: wrap; }

  /* Mode select — — — — — — — — — — — — — — — — — — — — — */
  .mode-select {
    display: flex;
    gap: 20px;
    margin-bottom: 16px;
    font-size: 0.88rem;
  }
  .mode-select label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    color: var(--text-dim);
    transition: color 0.15s;
  }
  .mode-select label:has(input:checked) { color: var(--heading); }
  .mode-select input[type="radio"] {
    accent-color: var(--heading);
    width: 14px; height: 14px;
  }
  #modeHint { color: var(--text-dim); font-size: 0.82rem; }
  .mermaid-check {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 16px;
    font-size: 0.84rem;
    color: var(--text-dim);
    cursor: pointer;
    letter-spacing: -0.01em;
  }
  .mermaid-check input[type="checkbox"] {
    accent-color: var(--accent);
    width: 14px; height: 14px;
  }

  /* Progress — — — — — — — — — — — — — — — — — — — — — — */
  .progress-card { margin-bottom: 40px; }
  .step-list { display: flex; flex-direction: column; gap: 2px; }
  .step {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.9rem;
    padding: 8px 0;
  }
  .step .icon { font-size: 1rem; width: 20px; text-align: center; opacity: 0.5; }
  .step .label { flex: 1; font-weight: 500; }
  .step .detail { color: var(--text-dim); font-size: 0.82rem; }
  .step.pending { opacity: 0.3; }
  .step.running .icon { opacity: 1; animation: pulse 1s infinite; }
  .step.done .icon { opacity: 1; }
  .step.error .icon { opacity: 1; color: var(--red); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* Search results — — — — — — — — — — — — — — — — — — — */
  .search-results { margin-bottom: 40px; }
  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: border-color 0.15s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .result-card:hover { border-color: var(--accent); }
  .result-card.selected { border-color: var(--accent); background: #f7f3ec; }
  .result-info h4 { font-size: 0.9rem; color: var(--heading); font-weight: 500; margin-bottom: 3px; }
  .result-info span { font-size: 0.82rem; color: var(--text-dim); }
  .result-stats { font-size: 0.85rem; color: var(--text-dim); }

  /* 历史记录 — — — — — — — — — — — — — — — — — — — — — — — */
  .section-card { margin-bottom: 40px; }
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    padding: 4px 0;
    margin-bottom: 16px;
  }
  .section-header h2 {
    font-size: 1rem;
    font-weight: 600;
    color: var(--heading);
    letter-spacing: -0.02em;
  }
  .section-header span { font-size: 0.85rem; color: var(--text-dim); }
  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: color 0.15s;
  }
  .history-item:hover .history-title { color: var(--heading); }
  .history-item:last-child { border-bottom: none; }
  .history-info { flex: 1; min-width: 0; }
  .history-title {
    font-size: 0.9rem;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .history-meta {
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-top: 3px;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .history-meta a { color: var(--text); text-decoration: none; }
  .history-meta a:hover { color: var(--heading); }
  .history-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .platform-badge {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 99px;
    font-size: 0.72rem;
    font-weight: 500;
    background: #f5f1eb;
    color: var(--accent);
    border: 1px solid var(--border);
  }

  /* Preview — — — — — — — — — — — — — — — — — — — — — — — */
  .preview-card { margin-bottom: 40px; }
  .preview-card > h2 {
    font-size: 1rem;
    font-weight: 600;
    color: var(--heading);
    margin-bottom: 28px;
    letter-spacing: -0.02em;
  }
  .markdown-body {
    line-height: 1.85;
    font-size: 0.95rem;
  }
  .markdown-body h1 { font-size: 1.6rem; font-weight: 600; color: var(--heading); margin: 40px 0 16px; letter-spacing: -0.03em; }
  .markdown-body h2 { font-size: 1.2rem; font-weight: 600; color: var(--heading); margin: 36px 0 12px; letter-spacing: -0.02em; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .markdown-body h3 { font-size: 1rem; font-weight: 600; color: var(--heading); margin: 28px 0 8px; letter-spacing: -0.01em; }
  .markdown-body p { margin: 10px 0; }
  .markdown-body blockquote {
    border-left: 2px solid var(--accent);
    padding: 6px 0 6px 16px;
    margin: 16px 0;
    color: var(--text-dim);
    font-style: italic;
  }
  .markdown-body ul, .markdown-body ol { padding-left: 20px; margin: 8px 0; }
  .markdown-body li { margin: 3px 0; }
  .markdown-body code {
    background: #f5f1eb;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 0.85em;
    border: 1px solid var(--border);
  }
  .markdown-body pre {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    overflow-x: auto;
    margin: 16px 0;
    font-size: 0.85rem;
  }
  .markdown-body pre code { background: none; border: none; padding: 0; }
  .markdown-body table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
    font-size: 0.88rem;
  }
  .markdown-body th {
    text-align: left;
    padding: 10px 14px;
    color: var(--heading);
    font-weight: 600;
    border-bottom: 1px solid var(--border);
  }
  .markdown-body td { padding: 8px 14px; border-bottom: 1px solid var(--border); }
  .markdown-body strong { color: var(--heading); font-weight: 600; }
  .markdown-body a { color: var(--heading); text-decoration: underline; text-underline-offset: 3px; }
  .markdown-body hr { border: none; border-top: 1px solid var(--border); margin: 40px 0; }

  /* Footer — — — — — — — — — — — — — — — — — — — — — — — */
  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.78rem;
    margin-top: 80px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    letter-spacing: -0.01em;
  }

  /* Toast — — — — — — — — — — — — — — — — — — — — — — — — */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--heading);
    color: #fff;
    padding: 8px 20px;
    border-radius: 99px;
    font-size: 0.85rem;
    font-weight: 500;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 600px) {
    .container { padding: 32px 14px 80px; }
    header { margin-bottom: 40px; }
    header h1 { font-size: 1.5rem; }
    header p { font-size: 0.85rem; }
    .input-row { flex-direction: column; }
    .input-row input { font-size: 0.9rem; padding: 10px 14px; }
    .input-row select { font-size: 0.85rem; padding: 10px 12px; }
    .mode-select { gap: 14px; font-size: 0.82rem; }
    .input-tab { font-size: 0.82rem; padding: 8px 14px; }
    .input-textarea { font-size: 0.85rem; min-height: 100px; padding: 10px 14px; }
    .title-input { font-size: 0.9rem; }
    .mode-btn { font-size: 0.78rem; padding: 6px 10px; }
    .btn { padding: 10px 16px; font-size: 0.85rem; }
    .btn-sm { padding: 6px 12px; font-size: 0.78rem; }
    .btn-row { gap: 6px; }
    .step { font-size: 0.85rem; }
    .markdown-body { font-size: 0.9rem; }
    .markdown-body h1 { font-size: 1.3rem; }
    .markdown-body h2 { font-size: 1.1rem; }
    .markdown-body table { font-size: 0.8rem; }
    .markdown-body th, .markdown-body td { padding: 6px 8px; }
    .history-item { flex-wrap: wrap; }
    .history-actions { margin-top: 4px; }
    .result-card { padding: 10px 14px; }
    footer { font-size: 0.72rem; margin-top: 40px; }
  }

  /* Settings page — — — — — — — — — — — — — — — — — — — — */
  .gear-btn {
    background: none; border: none; font-size: 1.3rem; cursor: pointer;
    padding: 6px; color: var(--text-dim); transition: color 0.15s;
    line-height: 1;
  }
  .gear-btn:hover { color: var(--heading); }
  .header-row {
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .settings-page {
    position: fixed; inset: 0; z-index: 300;
    background: var(--bg);
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .settings-page.open { opacity: 1; pointer-events: auto; }
  .settings-page-head {
    display: flex; align-items: center; gap: 16px;
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .settings-page-head h1 {
    font-size: 1.1rem; font-weight: 600; color: var(--heading);
    letter-spacing: -0.02em; margin: 0;
  }
  .settings-back {
    background: none; border: none; font-size: 1.2rem; cursor: pointer;
    color: var(--text-dim); padding: 0; transition: color 0.15s;
  }
  .settings-back:hover { color: var(--heading); }
  .settings-body {
    flex: 1; overflow-y: auto; padding: 24px 28px;
  }
  .settings-group {
    margin-bottom: 28px;
  }
  .settings-group-title {
    font-size: 0.95rem; font-weight: 600; color: var(--heading);
    margin: 0 0 6px; letter-spacing: -0.02em;
  }
  .settings-group-desc {
    font-size: 0.82rem; color: var(--text-dim);
    margin: 0 0 18px; line-height: 1.5;
  }
  .settings-field { margin-bottom: 16px; }
  .settings-field label {
    display: flex; align-items: center; gap: 4px;
    font-size: 0.84rem; font-weight: 500; color: var(--text);
    margin-bottom: 4px;
  }
  .settings-field input[type="text"],
  .settings-field input[type="password"] {
    width: 100%;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 9px 12px;
    color: var(--heading); font-size: 0.88rem; font-family: var(--font);
    outline: none; transition: border-color 0.15s;
  }
  .settings-field input:focus { border-color: var(--accent); }
  .settings-field input::placeholder { color: var(--text-dim); }
  .settings-radios {
    display: flex; gap: 16px; font-size: 0.86rem;
  }
  .settings-radios label {
    cursor: pointer; color: var(--text-dim); transition: color 0.15s;
    display: flex; align-items: center; gap: 4px; font-weight: 400;
  }
  .settings-radios label:has(input:checked) { color: var(--heading); }
  .settings-radios input[type="radio"] { accent-color: var(--heading); }
  .settings-toggle {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 0.84rem; color: var(--text);
  }
  .settings-toggle input[type="checkbox"] {
    accent-color: var(--accent); width: 16px; height: 16px;
  }
  .settings-page-foot {
    display: flex; gap: 8px; padding: 16px 28px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    justify-content: flex-end;
  }
  .input-with-eye { position: relative; }
  .input-with-eye input { width: 100%; padding-right: 36px; }
  .input-with-eye .eye-btn {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; color: var(--text-dim);
    font-size: 0.9rem; padding: 2px 4px;
  }
  /* Help icon + tooltip — — — — — — — — — — — — — — — — */
  .help-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 15px; height: 15px; border-radius: 50%;
    border: 1px solid var(--border);
    color: var(--text-dim); font-size: 0.65rem; font-weight: 500;
    cursor: help; transition: color 0.15s, border-color 0.15s;
    position: relative;
  }
  .help-icon:hover {
    color: var(--accent); border-color: var(--accent);
  }
  .help-icon::after {
    content: attr(data-tip);
    display: none;
    position: absolute; bottom: calc(100% + 8px); left: 50%;
    transform: translateX(-50%);
    background: var(--heading); color: #fff;
    font-size: 0.76rem; font-weight: 400; line-height: 1.5;
    padding: 6px 12px; border-radius: var(--radius-sm);
    max-width: 260px; white-space: normal;
    z-index: 10; pointer-events: none;
  }
  .help-icon:hover::after { display: block; }
  /* Error / Success — — — — — — — — — — — — — — — — — — */
  .settings-error {
    color: var(--red); font-size: 0.84rem; padding: 10px 14px;
    background: #fef2f2; border-radius: var(--radius-sm); display: none;
    margin-bottom: 16px;
  }
  .settings-success {
    color: var(--green); font-size: 0.84rem; padding: 10px 14px;
    background: #f0faf0; border-radius: var(--radius-sm); display: none;
    margin-bottom: 16px;
  }
  @media (max-width: 600px) {
    .settings-page-head { padding: 16px 18px; }
    .settings-body { padding: 18px; }
    .settings-page-foot { padding: 12px 18px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <div>
        <h1>Video to Notes</h1>
        <p>粘贴视频链接，获取结构化笔记</p>
      </div>
      <button class="gear-btn" onclick="openSettings()" title="设置">⚙</button>
    </div>

  <!-- Input -->
  <div class="input-card" id="inputCard">
    <div class="input-tabs">
      <button class="input-tab active" onclick="switchMode('url')" id="tabUrl">链接</button>
      <button class="input-tab" onclick="switchMode('text')" id="tabText">文本</button>
    </div>

    <!-- URL input group -->
    <div id="urlInputGroup">
      <div class="input-row">
        <input type="text" id="urlInput" placeholder="粘贴视频链接，或输入搜索关键词…">
        <select id="platformSelect">
          <option value="xhs">小红书</option>
          <option value="bilibili">Bilibili</option>

      </div>
    </div>

    <!-- Text input group (hidden by default) -->
    <div id="textInputGroup" style="display:none">
      <input type="text" id="titleInput" class="title-input" placeholder="输入标题（必填）…">
      <textarea id="textInput" class="input-textarea" placeholder="粘贴转录文本内容…"></textarea>
    </div>

    <div class="mode-select">
      <label><input type="radio" name="mode" value="standard" checked onchange="updateModeHint()"><span>标准笔记</span></label>
      <label><input type="radio" name="mode" value="detailed" onchange="updateModeHint()"><span>详细笔记</span></label>
      <label><input type="radio" name="mode" value="scholar" onchange="updateModeHint()"><span>详解笔记</span></label>
      <span id="modeHint">快，适合短视频</span>
    </div>
    <label class="mermaid-check">
      <input type="checkbox" id="mermaidToggle" />
      <span>包含 Mermaid 图解</span>
    </label>
    <button class="btn btn-primary btn-full" id="submitBtn" onclick="handleSubmit()">
      开始处理
    </button>
  </div>

  <!-- Search Results -->
  <div class="search-results" id="searchResults" style="display:none"></div>

  <!-- Progress -->
  <div class="progress-card" id="progressCard" style="display:none">
    <div class="step-list">
      <div class="step" id="stepResolve"><span class="icon">1</span><span class="label">解析链接</span><span class="detail"></span></div>
      <div class="step" id="stepDownload"><span class="icon">2</span><span class="label">下载音频</span><span class="detail"></span></div>
      <div class="step" id="step语音转录"><span class="icon">3</span><span class="label">语音转录</span><span class="detail"></span></div>
      <div class="step" id="stepGenerate"><span class="icon">4</span><span class="label">生成笔记</span><span class="detail"></span></div>
    </div>
  </div>

  <!-- 历史记录 -->
  <div class="section-card" id="historyCard" style="display:none">
    <div class="section-header" onclick="toggle历史记录()">
      <h2>历史记录 <span id="historyCount"></span></h2>
      <span id="historyToggle">展开</span>
    </div>
    <div id="historyList" style="display:none"></div>
  </div>

  <!-- Preview -->
  <div class="preview-card" id="previewCard" style="display:none">
    <h2>笔记预览</h2>
    <div class="markdown-body" id="previewContent"></div>

    <!-- Transcript preview (collapsible) -->
    <div class="section-card" id="transcriptPreview" style="display:none;margin-top:24px">
      <div class="section-header" onclick="toggleTranscript()">
        <h2>📝 转录文本 <span id="transcriptLen" style="font-size:0.8rem;color:var(--text-dim)"></span></h2>
        <span id="transcriptToggle" style="font-size:0.85rem;color:var(--text-dim)">展开 ▾</span>
      </div>
      <div id="transcriptContent" style="display:none;max-height:400px;overflow-y:auto;padding:16px;background:var(--bg);border-radius:8px;font-size:0.85rem;line-height:1.8;white-space:pre-wrap;color:var(--text)"></div>

    <div class="btn-row">
      <button class="btn btn-primary btn-sm" onclick="downloadNotes()">下载 Markdown</button>
      <button class="btn btn-sm" onclick="downloadPDF()">下载 PDF</button>
      <button class="btn btn-sm dl-audio" onclick="downloadAudio()">🎵 下载音频</button>
      <button class="btn btn-sm dl-transcript" onclick="downloadTranscript()">📝 下载转录文本</button>
      <button class="btn btn-sm dl-merged" onclick="downloadMerged()">📋 笔记+转录</button>
      <button class="btn btn-sm dl-full" onclick="downloadFull()">📦 下载完整包</button>
      <button class="btn btn-sm" onclick="copyNotes()">复制全文</button>
      <button class="btn btn-sm" id="backToSearchBtn" onclick="backToSearch()" style="display:none">← 返回搜索结果</button>
      <button class="btn btn-sm" onclick="resetAll()">重新开始</button>

  <footer>
    本地 Whisper · yt-dlp · xhs-cli · Apple Silicon
  </footer>
</div>

<!-- Settings Page -->
<div class="settings-page" id="settingsPage">
  <header class="settings-page-head">
    <button class="settings-back" onclick="closeSettings()" aria-label="返回">‹ 返回</button>
    <h1>设置</h1>
  </header>

  <div class="settings-body">
    <!-- Group: API 配置 -->
    <div class="settings-group">

        <input type="text" id="setApiBase" placeholder="https://api.deepseek.com/v1">

          <label><input type="radio" name="setMode" value="standard"> 标准</label>
          <label><input type="radio" name="setMode" value="detailed"> 详细</label>
          <label><input type="radio" name="setMode" value="scholar"> 详解</label>

      </div>

      <div class="settings-field">
        <div class="settings-toggle">
          <span>默认 Mermaid 图解 <span class="help-icon" data-tip="开启后笔记自动插入框架图和内容图解">?</span></span>
          <input type="checkbox" id="setMermaid">

    <div class="settings-success" id="settingsSuccess"></div>

<div class="toast" id="toast"></div>

<script>
// ── State ────────────────────────────────────────────────────
let currentTaskId = null;
let currentNotes = '';
let currentMeta = {};
let currentInputUrl = '';
let currentTranscript = '';
let searchMode = false;
let currentInputMode = 'url';
let _lastSearchQuery = '';
let _lastSearchResults = null;

// ── DOM refs ─────────────────────────────────────────────────
const $url = document.getElementById('urlInput');
const $platform = document.getElementById('platformSelect');
const $submit = document.getElementById('submitBtn');
const $searchResults = document.getElementById('searchResults');
const $progress = document.getElementById('progressCard');
const $preview = document.getElementById('previewCard');
const $previewContent = document.getElementById('previewContent');
const $inputCard = document.getElementById('inputCard');
const steps = ['stepResolve', 'stepDownload', 'step语音转录', 'stepGenerate'];

// ── 历史记录 ──────────────────────────────────────────────────
const HISTORY_KEY = 'vtn-history';
const MAX_HISTORY = 20;

function load历史记录() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
  catch { return []; }
}

function save历史记录(entry) {
  let hist = load历史记录();
  hist = hist.filter(h => h.id !== entry.id);
  hist.unshift(entry);
  if (hist.length > MAX_HISTORY) hist = hist.slice(0, MAX_HISTORY);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));
  render历史记录();
}

function render历史记录() {
  const hist = load历史记录();
  const card = document.getElementById('historyCard');
  const list = document.getElementById('historyList');
  const count = document.getElementById('historyCount');
  if (hist.length === 0) { card.style.display = 'none'; return; }
  card.style.display = 'block';
  count.textContent = `· ${hist.length}`;
  list.innerHTML = hist.map(h => `
    <div class="history-item" onclick="load历史记录Item('${h.id}')">
      <div class="history-info">
        <div class="history-title">${h.title || '(无标题)'}</div>
        <div class="history-meta">
          <span>${h.date || ''}</span>
          <span class="platform-badge">${h.platform || ''}</span>
          ${h.url ? `<a href="${h.url}" target="_blank" onclick="event.stopPropagation()">🔗 原视频</a>` : ''}
        </div>
      </div>
      <div class="history-actions">
        <button class="btn btn-sm" onclick="event.stopPropagation();load历史记录Item('${h.id}')" title="View">↗</button>
        <button class="btn btn-sm" onclick="event.stopPropagation();delete历史记录Item('${h.id}')" title="Delete">✕</button>
      </div>
    </div>
  `).join('');
}

function load历史记录Item(id) {
  const hist = load历史记录();
  const item = hist.find(h => h.id === id);
  if (!item) return;
  currentNotes = item.notes;
  currentMeta = {title: item.title, platform: item.platform, url: item.url};
  showPreview(item.notes);
  document.getElementById('previewCard').scrollIntoView({behavior: 'smooth'});
}

function delete历史记录Item(id) {
  let hist = load历史记录();
  hist = hist.filter(h => h.id !== id);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));
  render历史记录();
}

function toggle历史记录() {
  const list = document.getElementById('historyList');
  const toggle = document.getElementById('historyToggle');
  const isOpen = list.style.display !== 'none';
  list.style.display = isOpen ? 'none' : 'block';
  toggle.textContent = isOpen ? '展开' : '收起';
}

render历史记录();

// ── Submit ───────────────────────────────────────────────────
function extractURL(text) {
  const match = text.match(/https?:\/\/[^\s]+/);
  return match ? match[0] : null;
}

async function handleSubmit() {
  if (!(await ensureApiConfig())) return;

  if (currentInputMode === 'text') {
    await processText();
    return;
  }

  const input = $url.value.trim();
  const platform = $platform.value;
  if (!input) return;

  const extractedURL = extractURL(input);

  if (extractedURL) {
    await processURL(extractedURL, platform);
  } else if (/xhslink/.test(input)) {
    await processURL(input, platform);
  } else {
    await searchVideos(input, platform);
  }
}

function updateModeHint() {
  const mode = document.querySelector('input[name="mode"]:checked').value;
  const hints = { standard: '快，适合短视频', detailed: '慢但完整，适合长视频', scholar: '深度详解，适合学习研究' };
  document.getElementById('modeHint').textContent = hints[mode] || hints.standard;
}

// ── Switch Mode ──────────────────────────────────────────────────
function switchMode(mode) {
  currentInputMode = mode;
  const tabUrl = document.getElementById('tabUrl');
  const tabText = document.getElementById('tabText');
  const urlGroup = document.getElementById('urlInputGroup');
  const textGroup = document.getElementById('textInputGroup');

  if (mode === 'url') {
    tabUrl.classList.add('active');
    tabText.classList.remove('active');
    urlGroup.style.display = '';
    textGroup.style.display = 'none';
    $submit.textContent = '开始处理';
  } else {
    tabText.classList.add('active');
    tabUrl.classList.remove('active');
    urlGroup.style.display = 'none';
    textGroup.style.display = '';
    $submit.textContent = '生成笔记';
  }
}

// ── Search ───────────────────────────────────────────────────
async function searchVideos(query, platform) {
  $submit.disabled = true;
  $submit.textContent = '搜索中…';
  $searchResults.style.display = 'block';
  $searchResults.innerHTML = '<div style="padding:16px;color:var(--text-dim)">搜索中…</div>';

  try {
    const resp = await fetch('/api/search', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query, platform})
    });
    const data = await resp.json();

    if (!data.results || data.results.length === 0) {
      $searchResults.innerHTML = '<p style="padding:16px;color:var(--text-dim)">无搜索结果</p>';
    } else {
      $searchResults.innerHTML = data.results.map((r, i) => `
        <div class="result-card" onclick="selectResult(${i})" id="result${i}">
          <div class="result-info">
            <h4>${r.title || '(no title)'}</h4>
            <span>${r.creator || ''} · ${formatDuration(r.duration)}</span>
          </div>
          <div class="result-stats">❤ ${r.likes || '0'}</div>
        </div>
      `).join('');
      _lastSearchResults = data.results;
      _lastSearchQuery = query;
      window._searchResults = data.results;
      window._searchTaskId = data.task_id;
      searchMode = true;
    }
  } catch (e) {
    $searchResults.innerHTML = `<p style="padding:16px;color:var(--red)">Error: ${e.message}</p>`;
  }

  $submit.disabled = false;
  $submit.textContent = '开始处理';
}

function selectResult(idx) {
  document.querySelectorAll('.result-card').forEach(c => c.classList.remove('selected'));
  document.getElementById('result' + idx).classList.add('selected');
  const r = window._searchResults[idx];
  const url = r.url || r.id;
  $url.value = url;
  $searchResults.style.display = 'none';
  processURL(url, r.platform || $platform.value, r.title, r.xsec);
}

function backToSearch() {
  if (!_lastSearchResults) return;
  $preview.style.display = 'none';
  $progress.style.display = 'none';
  $searchResults.style.display = 'block';
  $searchResults.innerHTML = _lastSearchResults.map((r, i) => `
    <div class="result-card" onclick="selectResult(${i})" id="result${i}">
      <div class="result-info">
        <h4>${r.title || '(no title)'}</h4>
        <span>${r.creator || ''} · ${formatDuration(r.duration)}</span>
      </div>
      <div class="result-stats">❤ ${r.likes || '0'}</div>
    </div>
  `).join('');
  $searchResults.scrollIntoView({behavior: 'smooth'});
}

// ── Process ──────────────────────────────────────────────────
async function processURL(url, platform, titleOverride, xsecOverride) {
  $submit.disabled = true;
  $submit.textContent = '处理中…';
  $searchResults.style.display = 'none';
  $preview.style.display = 'none';
  currentInputUrl = url;

  steps.forEach(s => {
    document.getElementById(s).className = 'step pending';
    document.getElementById(s).querySelector('.detail').textContent = '';
  });

  $progress.style.display = 'block';
  document.getElementById('stepResolve').className = 'step running';

  const mode = document.querySelector('input[name="mode"]:checked').value;
  try {
    const resp = await fetch('/api/process', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url, platform, title: titleOverride, xsec: xsecOverride, mode, mermaid: document.getElementById('mermaidToggle').checked})
    });

    if (!resp.ok) {
      const err = await resp.json();
      if (err.error === 'no_api_config') { showToast('请先配置 API'); openSettings(); }
      else { showToast(err.error || '请求失败'); }
      $submit.disabled = false; $submit.textContent = '开始处理'; return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          try { handleSSEEvent(JSON.parse(line.slice(6))); } catch(e) {}
        }
      }
    }
  } catch (e) {
    markStep('stepResolve', 'error', e.message);
  }

  $submit.disabled = false;
  $submit.textContent = '开始处理';
}

function handleSSEEvent(event) {
  if (event.event === 'progress') {
    const d = event.data;
    const ids = {resolve:'stepResolve',download:'stepDownload',transcribe:'step语音转录',generate:'stepGenerate'};
    const stepId = ids[d.step];
    if (stepId) {
      if (d.status === 'running') markStep(stepId, 'running', d.message || '');
      else if (d.status === 'done') markStep(stepId, 'done', d.message || '');
      else if (d.status === 'error') markStep(stepId, 'error', d.message || '');
    }
  } else if (event.event === 'complete') {
    const d = event.data;
    currentTaskId = d.task_id;
    currentNotes = d.notes;
    currentTranscript = d.transcript || '';
    currentMeta = d.meta || {};
    currentMeta.url = currentInputUrl;
    showPreview(currentNotes);
    const now = new Date();
    save历史记录({
      id: d.task_id,
      title: currentMeta.title || 'Untitled',
      platform: currentMeta.platform || '',
      url: currentInputUrl,
      date: `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`,
      notes: currentNotes
    });
  } else if (event.event === 'error') {
    markStep('stepResolve', 'error', event.data);
  }
}

// ── Process Text ──────────────────────────────────────────────────
async function processText() {
  const title = document.getElementById('titleInput').value.trim();
  const text = document.getElementById('textInput').value.trim();
  if (!title || !text) {
    showToast('请输入标题和文本内容');
    return;
  }

  $submit.disabled = true;
  $submit.textContent = '处理中…';
  $searchResults.style.display = 'none';
  $preview.style.display = 'none';
  currentInputUrl = '';

  steps.forEach(s => {
    document.getElementById(s).className = 'step pending';
    document.getElementById(s).querySelector('.detail').textContent = '';
  });

  $progress.style.display = 'block';
  document.getElementById('stepGenerate').className = 'step running';

  const mode = document.querySelector('input[name="mode"]:checked').value;

  try {
    const resp = await fetch('/api/process', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text, title, mode, mermaid: document.getElementById('mermaidToggle').checked})
    });

    if (!resp.ok) {
      const err = await resp.json();
      if (err.error === 'no_api_config') { showToast('请先配置 API'); openSettings(); }
      else { showToast(err.error || '请求失败'); }
      $submit.disabled = false; $submit.textContent = '生成笔记'; return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          try { handleSSEEvent(JSON.parse(line.slice(6))); } catch(e) {}
        }
      }
    }
  } catch (e) {
    markStep('stepGenerate', 'error', e.message);
  }

  $submit.disabled = false;
  $submit.textContent = '生成笔记';
}

function markStep(stepId, cls, detail) {
  const el = document.getElementById(stepId);
  if (!el) return;
  el.className = 'step ' + cls;
  if (detail) el.querySelector('.detail').textContent = detail;
}

async function showPreview(md) {
  $preview.style.display = 'block';
  $progress.style.display = 'none';
  $previewContent.innerHTML = marked.parse(md);
  document.getElementById('backToSearchBtn').style.display = _lastSearchResults ? '' : 'none';

  // In text mode, hide download buttons that don't apply and transcript preview
  const dlBtns = document.querySelectorAll('.dl-audio, .dl-transcript, .dl-merged, .dl-full');
  if (currentInputMode === 'text') {
    dlBtns.forEach(b => b.style.display = 'none');
    document.getElementById('transcriptPreview').style.display = 'none';
  } else {
    dlBtns.forEach(b => b.style.display = '');
    // Show transcript preview if available
    if (currentTranscript) {
      document.getElementById('transcriptPreview').style.display = 'block';
      document.getElementById('transcriptContent').textContent = currentTranscript;
      document.getElementById('transcriptLen').textContent = `(${currentTranscript.length} 字)`;
    }
  }
  $preview.scrollIntoView({behavior: 'smooth'});

  // Render Mermaid diagrams (async, non-blocking)
  try {
    await mermaid.run({
      nodes: $previewContent.querySelectorAll('code.language-mermaid'),
    });
  } catch (e) {
    // Mermaid rendering failure must not block note display
  }
}

function toggleTranscript() {
  const content = document.getElementById('transcriptContent');
  const toggle = document.getElementById('transcriptToggle');
  const open = content.style.display !== 'none';
  content.style.display = open ? 'none' : 'block';
  toggle.textContent = open ? '展开 ▾' : '收起 ▴';
}

// ── Actions ─────────────────────────────────────────────────
function downloadNotes() {
  const blob = new Blob([currentNotes], {type: 'text/markdown'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (currentMeta.title || 'notes') + '.md';
  a.click();
}

async function downloadPDF() {
  if (!currentNotes) return;
  const resp = await fetch('/api/export-pdf', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({notes: currentNotes, title: currentMeta.title || '笔记预览'})
  });
  if (resp.ok) {
    const blob = await resp.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (currentMeta.title || 'notes') + '.pdf';
    a.click();
  }
}

function downloadAudio() {
  if (currentTaskId) window.open(`/api/download/${currentTaskId}/audio`, '_blank');
}

function downloadTranscript() {
  if (currentTaskId) window.open(`/api/download/${currentTaskId}/transcript`, '_blank');
}

function downloadFull() {
  if (currentTaskId) window.open(`/api/download/${currentTaskId}/full`, '_blank');
}

function downloadMerged() {
  if (currentTaskId) window.open(`/api/download/${currentTaskId}/merged`, '_blank');
}

function copyNotes() {
  navigator.clipboard.writeText(currentNotes).then(() => showToast('已复制'));
}

function resetAll() {
  $url.value = '';
  document.getElementById('titleInput').value = '';
  document.getElementById('textInput').value = '';
  currentTaskId = null; currentNotes = ''; currentTranscript = ''; currentMeta = {}; currentInputUrl = '';
  $preview.style.display = 'none'; $progress.style.display = 'none';
  $searchResults.style.display = 'none';
  $previewContent.innerHTML = '';
  document.getElementById('transcriptPreview').style.display = 'none';
  document.getElementById('transcriptContent').textContent = '';
  document.querySelectorAll('.dl-audio, .dl-transcript, .dl-merged, .dl-full').forEach(b => b.style.display = '');
  steps.forEach(s => document.getElementById(s).className = 'step pending');
}

// ── Helpers ─────────────────────────────────────────────────
function formatDuration(sec) {
  if (!sec) return '';
  return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

$url.addEventListener('keydown', e => { if (e.key === 'Enter') handleSubmit(); });

// ── Settings ─────────────────────────────────────────────────
function openSettings() {
  document.getElementById('settingsPage').classList.add('open');
  loadSettings();
}

function closeSettings() {
  document.getElementById('settingsPage').classList.remove('open');
  document.getElementById('settingsError').style.display = 'none';
  document.getElementById('settingsSuccess').style.display = 'none';
}

async function loadSettings() {
  try {
    const resp = await fetch('/api/settings');
    const s = await resp.json();
    document.getElementById('setApiBase').value = s.api_base || '';
    document.getElementById('setApiKey').value = s.api_key || '';
    document.getElementById('setModel').value = s.model || 'deepseek-chat';
    document.getElementById('setMermaid').checked = s.default_mermaid || false;
    const modeRadio = document.querySelector(`input[name="setMode"][value="${s.default_mode || 'standard'}"]`);
    if (modeRadio) modeRadio.checked = true;
  } catch (e) {}
}

async function saveSettings() {
  const apiKey = document.getElementById('setApiKey').value.trim();
  const apiBase = document.getElementById('setApiBase').value.trim();
  const model = document.getElementById('setModel').value.trim() || 'deepseek-chat';
  const body = {
    api_base: apiBase,
    api_key: apiKey,
    model: model,
    default_mode: document.querySelector('input[name="setMode"]:checked')?.value || 'standard',
    default_mermaid: document.getElementById('setMermaid').checked,
  };

  // Save first
  try {
    const resp = await fetch('/api/settings', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    if (!resp.ok) { showToast('保存失败'); return; }
  } catch (e) { showToast('保存失败'); return; }

  // Auto test connection
  const errEl = document.getElementById('settingsError');
  const okEl = document.getElementById('settingsSuccess');
  errEl.style.display = 'none';
  okEl.style.display = 'block';
  okEl.textContent = '验证中…';

  try {
    const r = await fetch('/api/test-connection', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({api_key: apiKey, api_base: apiBase, model}),
    });
    const data = await r.json();
    if (data.ok) {
      showToast('已保存');
      setTimeout(() => closeSettings(), 600);
    } else {
      errEl.style.display = 'block';
      errEl.textContent = '连接失败: ' + (data.error || '未知错误');
      okEl.style.display = 'none';
    }
  } catch (e) {
    errEl.style.display = 'block';
    errEl.textContent = '连接失败: ' + e.message;
    okEl.style.display = 'none';
  }
}

async function testConnection() {
  const apiKey = document.getElementById('setApiKey').value.trim();
  const apiBase = document.getElementById('setApiBase').value.trim();
  const model = document.getElementById('setModel').value.trim() || 'deepseek-chat';
  if (!apiKey || !apiBase) {
    document.getElementById('settingsError').style.display = 'block';
    document.getElementById('settingsError').textContent = '请填写 API Key 和 Base URL';
    document.getElementById('settingsSuccess').style.display = 'none';
    return;
  }
  const errEl = document.getElementById('settingsError');
  const okEl = document.getElementById('settingsSuccess');
  errEl.style.display = 'none';
  okEl.style.display = 'block';
  okEl.textContent = '测试中…';
  try {
    const resp = await fetch('/api/test-connection', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({api_key: apiKey, api_base: apiBase, model}),
    });
    const r = await resp.json();
    if (r.ok) {
      okEl.textContent = `连接成功 · ${r.latency_ms}ms · ${r.model}`;
    } else {
      errEl.style.display = 'block';
      errEl.textContent = '连接失败: ' + (r.error || '未知错误');
      okEl.style.display = 'none';
    }
  } catch (e) {
    errEl.style.display = 'block';
    errEl.textContent = '连接失败: ' + e.message;
    okEl.style.display = 'none';
  }
}

function toggleKeyVisibility() {
  const input = document.getElementById('setApiKey');
  input.type = input.type === 'password' ? 'text' : 'password';
}

async function ensureApiConfig() {
  try {
    const resp = await fetch('/api/settings');
    const s = await resp.json();
    if (!s.api_base || !s.api_key) {
      showToast('请先配置 API');
      openSettings();
      return false;
    }
    return true;
  } catch (e) { return true; }
}

(async function initDefaults() {
  try {
    const resp = await fetch('/api/settings');
    const s = await resp.json();
    if (s.default_mode) {
      const radio = document.querySelector(`input[name="mode"][value="${s.default_mode}"]`);
      if (radio) { radio.checked = true; updateModeHint(); }
    }
    if (s.default_mermaid) {
      document.getElementById('mermaidToggle').checked = true;
    }
  } catch (e) {}
})();

mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'strict' });
</script>
